<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Husemann2MQTT</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --text: #212121; --muted: #6f6f6f; --line: #e0e0e0;
    --accent: #03a9f4; --ok: #2e7d32; --warn: #ef6c00; --bad: #c62828; --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9e9e9e; --line: #333;
            --accent: #4fc3f7; --ok: #66bb6a; --warn: #ffa726; --bad: #ef5350; --input: #262626; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 Roboto, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; color: var(--muted); }
  .gateways { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          padding: 4px 12px; display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px;
             border-bottom: 1px solid var(--line); }
  .toolbar .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
           border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr.gw td { background: color-mix(in srgb, var(--accent) 8%, var(--card)); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.muted, span.muted { color: var(--muted); }
  input[type=text] { font: inherit; width: 100%; min-width: 140px; padding: 6px 8px; border-radius: 4px;
                     border: 1px solid var(--line); background: var(--input); color: var(--text); }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  tr.off td:not(.keep) { opacity: .6; }
  .status { padding: 8px 12px; color: var(--muted); border-top: 1px solid var(--line); min-height: 36px; }
  .status.dirty { color: var(--warn); }
  .status.ok { color: var(--ok); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  td.live { color: var(--muted); font-variant-numeric: tabular-nums; }
  #table { overflow-x: auto; }
  tr.details td { background: color-mix(in srgb, var(--accent) 4%, var(--card)); padding: 6px 12px 10px 44px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 16px; }
  .grid div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0;
              border-bottom: 1px dotted var(--line); font-variant-numeric: tabular-nums; }
  .grid div span:first-child { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid div.diag { opacity: .6; }
  button.toggle { white-space: nowrap; }
  @media (max-width: 720px) {
    .hide-sm { display: none; }
    main { padding: 8px; }
  }
</style>
</head>
<body>
<main>
  <h1>Husemann2MQTT</h1>
  <p class="lead">Gefundene Geräte der Tixi-Gateways. Haken setzen und Namen vergeben – angehakte Geräte
    erscheinen innerhalb weniger Sekunden mit diesem Namen in Home Assistant, abgehakte werden entfernt.
    „Werte“ zeigt die aktuellen Messwerte eines Geräts, um es beim Benennen zuzuordnen.</p>

  <div class="gateways" id="gateways"></div>

  <div class="card">
    <div class="toolbar">
      <button id="all">Alle auswählen</button>
      <button id="none">Keine</button>
      <span class="spacer"></span>
      <span id="count" class="muted"></span>
      <button id="save" class="primary" disabled>Speichern</button>
    </div>
    <div id="table"></div>
    <div class="status" id="status"></div>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let snapshot = null;          // letzter Stand vom Server
  let edits = {};               // key -> {name, enabled} (ungespeichert)
  const expanded = new Set();   // keys mit aufgeklappten Werten
  let saving = false;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const ago = (ts) => {
    if (!ts) return "–";
    const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
    if (s < 90) return `vor ${s} s`;
    if (s < 5400) return `vor ${Math.round(s / 60)} min`;
    if (s < 172800) return `vor ${Math.round(s / 3600)} h`;
    return new Date(ts * 1000).toLocaleDateString("de-DE");
  };
  const dirty = () => Object.keys(edits).length > 0;

  async function api(path, body) {
    const res = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"},
                                           body: JSON.stringify(body)} : {cache: "no-store"});
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return res.json();
  }

  function current(dev) {
    const e = edits[dev.key] || {};
    return {name: e.name ?? dev.name, enabled: e.enabled ?? dev.enabled};
  }

  function renderGateways() {
    $("gateways").innerHTML = snapshot.gateways.map((g) => {
      const cls = g.online ? "ok" : (g.last_ok ? "warn" : "bad");
      const info = g.online ? `${g.device_count} Geräte · ${Math.round(g.latency_ms ?? 0)} ms`
                            : (g.error || "offline") + (g.last_ok ? ` · zuletzt ${ago(g.last_ok)}` : "");
      return `<span class="chip"><span class="dot ${cls}"></span><b>${esc(g.name)}</b>
              <span class="muted">${esc(g.host)} · ${esc(info)}</span></span>`;
    }).join("") || `<span class="chip"><span class="dot"></span>Warte auf ersten Scan …</span>`;
  }

  const isFound = (d) => d.last_seen && snapshot.gateways.some((g) => g.name === d.gateway && g.online) &&
                         (Date.now() / 1000 - d.last_seen) < 120;
  const statusCell = (d) => !isFound(d) ? `<span class="dot bad"></span> nicht gefunden`
                          : d.online ? `<span class="dot ok"></span> online`
                          : `<span class="dot warn"></span> keine Antwort am Bus`;
  const forgetCell = (d) => isFound(d) ? "" : `<button class="link" data-forget="${esc(d.key)}">Vergessen</button>`;
  const actionCell = (d) => `<button class="toggle" data-toggle="${esc(d.key)}">${expanded.has(d.key) ? "▾" : "▸"} Werte</button>
    ${forgetCell(d)}`;
  const detailsHtml = (d) => d.values.length
    ? `<div class="grid">${d.values.map((v) => `<div class="${v.diagnostic ? "diag" : ""}" title="${esc(v.point)}">
        <span>${esc(v.name)}</span><span>${esc(v.value)}</span></div>`).join("")}</div>`
    : `<span class="muted">Noch keine Werte empfangen.</span>`;

  function renderTable() {
    const devs = snapshot.devices;
    if (!devs.length) {
      $("table").innerHTML = `<div class="empty">Noch keine Geräte gefunden. Sobald ein Gateway antwortet,
        erscheinen die Busteilnehmer hier.</div>`;
      return;
    }
    let html = `<table><thead><tr>
      <th>MQTT</th><th>Knoten</th><th>Typ</th><th class="hide-sm">Seriennr.</th><th>Status</th>
      <th class="hide-sm">Aktuell</th><th class="hide-sm">Gesehen</th><th>Name in Home Assistant</th><th></th>
      </tr></thead><tbody>`;
    let gw = null;
    for (const d of devs) {
      if (d.gateway !== gw) {
        gw = d.gateway;
        html += `<tr class="gw"><td colspan="9">${esc(gw)}</td></tr>`;
      }
      const c = current(d);
      html += `<tr class="${c.enabled ? "" : "off"}" data-key="${esc(d.key)}">
        <td class="keep"><input type="checkbox" data-f="enabled" ${c.enabled ? "checked" : ""}></td>
        <td><b>${esc(d.node)}</b></td>
        <td>${esc(d.model || "–")}</td>
        <td class="hide-sm muted">${esc(d.serial || "–")}</td>
        <td style="white-space:nowrap" data-c="status">${statusCell(d)}</td>
        <td class="live hide-sm" data-c="live">${esc(d.summary || "–")}</td>
        <td class="hide-sm muted" data-c="seen">${ago(d.last_seen)}</td>
        <td class="keep"><input type="text" data-f="name" value="${esc(c.name)}" placeholder="${esc(d.default_name)}"></td>
        <td class="keep" data-c="actions">${actionCell(d)}</td>
      </tr>`;
      if (expanded.has(d.key)) {
        html += `<tr class="details" data-for="${esc(d.key)}"><td colspan="9">${detailsHtml(d)}</td></tr>`;
      }
    }
    $("table").innerHTML = html + "</tbody></table>";
  }

  function renderStatus(msg, cls) {
    const el = $("status");
    const n = snapshot ? snapshot.devices.filter((d) => current(d).enabled).length : 0;
    $("count").textContent = snapshot ? `${n} von ${snapshot.devices.length} Geräten aktiv` : "";
    $("save").disabled = saving || !dirty();
    if (msg !== undefined) { el.textContent = msg; el.className = "status " + (cls || ""); return; }
    if (dirty()) { el.textContent = "Ungespeicherte Änderungen – auf „Speichern“ klicken."; el.className = "status dirty"; }
    else if (snapshot && snapshot.pending) { el.textContent = "Änderungen werden auf MQTT angewendet …"; el.className = "status"; }
    else { el.textContent = "Alles gespeichert. Namen, die in Home Assistant manuell vergeben wurden, haben dort Vorrang."; el.className = "status"; }
  }

  function render(full) {
    renderGateways();
    if (full || !dirty()) { renderTable(); renderStatus(); return; }
    // Ungespeicherte Eingaben nicht anfassen: nur Statusspalten aktualisieren.
    for (const d of snapshot.devices) {
      const row = document.querySelector(`tr[data-key="${CSS.escape(d.key)}"]`);
      if (!row) { renderTable(); break; }
      row.querySelector('[data-c="status"]').innerHTML = statusCell(d);
      row.querySelector('[data-c="live"]').textContent = d.summary || "–";
      row.querySelector('[data-c="seen"]').textContent = ago(d.last_seen);
      row.querySelector('[data-c="actions"]').innerHTML = actionCell(d);
      const det = document.querySelector(`tr.details[data-for="${CSS.escape(d.key)}"] td`);
      if (det) det.innerHTML = detailsHtml(d);
    }
    renderStatus();
  }

  async function refresh(full) {
    try {
      snapshot = await api("api/devices");
      render(full);
    } catch (err) {
      renderStatus(`Verbindung zum Add-on fehlgeschlagen: ${err.message}`, "dirty");
    }
  }

  async function save() {
    if (!dirty() || saving) return;
    saving = true; renderStatus("Speichere …");
    try {
      const devices = Object.entries(edits).map(([key, e]) => ({key, ...e}));
      snapshot = await api("api/devices", {devices});
      edits = {};
      render(true);
      renderStatus(`${snapshot.changed ?? devices.length} Geräte gespeichert – Home Assistant wird aktualisiert.`, "ok");
    } catch (err) {
      renderStatus(`Speichern fehlgeschlagen: ${err.message}`, "dirty");
    } finally { saving = false; $("save").disabled = !dirty(); }
  }

  // --- Ereignisse ---------------------------------------------------------
  $("table").addEventListener("input", (ev) => {
    const row = ev.target.closest("tr[data-key]"); if (!row) return;
    const key = row.dataset.key, f = ev.target.dataset.f;
    const dev = snapshot.devices.find((d) => d.key === key);
    const e = edits[key] || {};
    if (f === "enabled") { e.enabled = ev.target.checked; row.classList.toggle("off", !e.enabled); }
    if (f === "name") e.name = ev.target.value;
    if ((e.enabled ?? dev.enabled) === dev.enabled && (e.name ?? dev.name) === dev.name) delete edits[key];
    else edits[key] = e;
    renderStatus();
  });
  $("table").addEventListener("click", async (ev) => {
    const toggle = ev.target.dataset.toggle;
    if (toggle) {
      expanded.has(toggle) ? expanded.delete(toggle) : expanded.add(toggle);
      renderTable();                       // Eingaben bleiben erhalten: edits werden mitgerendert
      return;
    }
    const key = ev.target.dataset.forget; if (!key) return;
    if (!confirm("Gerät aus der Liste und aus Home Assistant entfernen?")) return;
    try { snapshot = await api("api/forget", {key}); delete edits[key]; render(true); }
    catch (err) { renderStatus(`Entfernen fehlgeschlagen: ${err.message}`, "dirty"); }
  });
  const setAll = (on) => {
    for (const d of snapshot?.devices ?? []) {
      const e = edits[d.key] || {};
      e.enabled = on;
      if (e.enabled === d.enabled && (e.name ?? d.name) === d.name) delete edits[d.key]; else edits[d.key] = e;
    }
    renderTable(); renderStatus();
  };
  $("all").onclick = () => setAll(true);
  $("none").onclick = () => setAll(false);
  $("save").onclick = save;
  document.addEventListener("keydown", (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "s") { ev.preventDefault(); save(); }
  });

  refresh(true);
  setInterval(() => refresh(false), 5000);
})();
</script>
</body>
</html>
