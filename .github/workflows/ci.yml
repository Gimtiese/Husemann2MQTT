name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  addon:
    # Prüft, ob das Add-on-Image für amd64 baut (wie es HA Supervisor tun würde).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/builder@master
        with:
          args: --test --amd64 --target husemann2mqtt --image husemann2mqtt --docker-hub local
